[project]
name = "safer-streets-apps"
version = "0.1.0"
authors = [
    { name = "Andrew Smith", email = "a.p.smith@leeds.ac.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "safer-streets-core",
    "streamlit>=1.48.0",
    "fastapi[standard]",
    "plotnine>=0.15.3",
    "marimo>=0.21.1",
    "pyzmq>=27.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
safer-streets-core = { path = "../safer-streets-core", editable = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/test/*.py" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["src/test"]

[tool.mypy]
strict = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]
